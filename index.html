<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Slide Flipbook</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body {
            background: #111827;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow: hidden;
        }
        .upload-btn {
            background: #4f46e5;
            color: #fff;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            border: none;
        }
        .upload-btn:hover { background: #4338ca; }
        
        /* Book Container */
        .book-wrapper {
            perspective: 1500px;
            width: 100%;
            max-width: 420px;
            height: 540px;
            display: none;
            position: relative;
        }
        .page-card {
            width: 100%;
            height: 100%;
            background: #fff;
            border-radius: 4px 14px 14px 4px;
            box-shadow: -8px 0 20px rgba(0,0,0,0.6), inset 15px 0 25px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transform-origin: left center;
            transition: transform 0.45s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s;
            user-select: none;
            cursor: grab;
        }
        .page-card:active { cursor: grabbing; }
        .page-card.flip-next { transform: rotateY(-45deg); opacity: 0.3; }
        .page-card.flip-prev { transform: rotateY(30deg); opacity: 0.3; }
        
        .page-card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            pointer-events: none;
        }
        .hint {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #9ca3af;
            display: none;
        }
    </style>
</head>
<body>

    <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
        Select Images for Book
    </button>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none" onchange="loadImages(this.files)">

    <div class="book-wrapper" id="bookWrapper">
        <div class="page-card" id="pageCard">
            <img id="pageImg" src="" alt="Page">
        </div>
    </div>

    <p class="hint" id="hintText">Slide left or right on the page to flip (Page <span id="pageNum">1/1</span>)</p>

    <script>
        let images = [];
        let index = 0;
        let startX = 0;

        function loadImages(files) {
            if (!files || files.length === 0) return;
            images = [];
            for (let i = 0; i < files.length; i++) {
                images.push(URL.createObjectURL(files[i]));
            }
            index = 0;
            document.getElementById('bookWrapper').style.display = 'block';
            document.getElementById('hintText').style.display = 'block';
            showPage('none');
        }

        function showPage(dir) {
            const card = document.getElementById('pageCard');
            const img = document.getElementById('pageImg');
            
            if (dir === 'next') card.classList.add('flip-next');
            if (dir === 'prev') card.classList.add('flip-prev');

            setTimeout(() => {
                img.src = images[index];
                card.classList.remove('flip-next', 'flip-prev');
            }, dir === 'none' ? 0 : 180);

            document.getElementById('pageNum').innerText = (index + 1) + ' / ' + images.length;
        }

        const card = document.getElementById('pageCard');

        // Mobile Touch Slide
        card.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
        card.addEventListener('touchend', e => {
            let endX = e.changedTouches[0].clientX;
            handleSwipe(startX - endX);
        });

        // Laptop Mouse Drag Slide
        card.addEventListener('mousedown', e => { startX = e.clientX; });
        card.addEventListener('mouseup', e => {
            let endX = e.clientX;
            handleSwipe(startX - endX);
        });

        function handleSwipe(diff) {
            if (diff > 40 && index < images.length - 1) {
                index++;
                showPage('next');
            } else if (diff < -40 && index > 0) {
                index--;
                showPage('prev');
            }
        }
    </script>

</body>
</html>
