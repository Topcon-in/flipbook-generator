<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flipbook Generator - Client Side</title>
  <!-- Tailwind CSS for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Header -->
  <header class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between py-4 border-b border-slate-800 gap-4">
    <h1 class="text-2xl font-black tracking-wider text-amber-400">FLIPBOOK STUDIO 3D</h1>
    <div class="flex items-center gap-3">
      <button onclick="window.loadSampleBook()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition shadow-lg">
        Try Demo Book
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-2 rounded-lg cursor-pointer transition border border-slate-700">
        Upload PDF / Images
        <input type="file" id="fileInput" accept="image/*,application/pdf" multiple class="hidden">
      </label>
    </div>
  </header>

  <!-- Main Viewer Area -->
  <main class="w-full max-w-5xl flex-1 flex flex-col items-center justify-center relative my-8">
    
    <!-- Loader Overlay -->
    <div id="loader" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
      <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="loaderText" class="text-slate-300 font-medium">Processing book...</p>
    </div>

    <!-- Flipbook Container -->
    <div id="flipbookWrapper" class="w-full flex items-center justify-center overflow-hidden py-6">
      <div id="bookContainer">
        <canvas id="flipbook"></canvas>
      </div>
    </div>

    <!-- Controls / Navigation -->
    <div class="flex items-center gap-6 mt-6 bg-slate-800/60 backdrop-blur px-6 py-3 rounded-full border border-slate-700/50 shadow-xl">
      <button id="prevBtn" class="hover:text-amber-400 font-bold transition disabled:opacity-30">◀️ Prev</button>
      <span id="pageIndicator" class="text-sm font-semibold tracking-wide text-slate-300">Page 0 of 0</span>
      <button id="nextBtn" class="hover:text-amber-400 font-bold transition disabled:opacity-30">Next ▶️</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-xs text-slate-500 py-2">
    Client-side 3D Flipbook Engine • Zero Server Uploads Required
  </footer>

  <!-- Core Application Script -->
  <script>
    let pageFlip = null;
    const fileInput = document.getElementById('fileInput');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const pageIndicator = document.getElementById('pageIndicator');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const bookEl = document.getElementById('flipbook');

    function showLoader(text) {
      loaderText.textContent = text;
      loader.classList.remove('hidden');
    }

    function hideLoader() {
      loader.classList.add('hidden');
    }

    // Web Audio API for page flip sound effects
    function playFlipSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.1);
      } catch (e) {
        // Ignore audio context restrictions before user gesture
      }
    }

    // Initialize Demo Sample Book
    window.loadSampleBook = function() {
      showLoader("Loading Demo Book...");
      const titles = [
        {
          title: "THE MIDNIGHT ARCHIVE",
          sub: "Interactive 3D Flipbook Demo\nSwipe or Drag Corner to Turn Page",
          bg: "#0f172a",
          fg: "#f8fafc"
        },
        {
          title: "Chapter 1: The Locked Door",
          sub: "Every page turns with realistic 3D shadows and paper physics.\nUpload your own PDF or multiple photos to begin.",
          bg: "#fffbeb",
          fg: "#1e293b"
        },
        {
          title: "Chapter 2: Mobile Touch Ready",
          sub: "Designed specifically for smartphones and tablets.\nJust swipe your finger from right to left like a real book.",
          bg: "#f8fafc",
          fg: "#1e293b"
        }
      ];

      // Generate dummy canvas images for demo
      const pages = titles.map((t, i) => {
        const canvas = document.createElement('canvas');
        canvas.width = 600;
        canvas.height = 800;
        const ctx = canvas.getContext('2d');
        
        ctx.fillStyle = t.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = t.fg;
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t.title, canvas.width / 2, 300);
        
        ctx.font = "20px sans-serif";
        const lines = t.sub.split('\n');
        lines.forEach((line, idx) => {
          ctx.fillText(line, canvas.width / 2, 400 + (idx * 30));
        });

        return { src: canvas.toDataURL() };
      });

      renderFlipbook(pages);
      hideLoader();
    };

    function updateIndicator(currentIndex, total) {
      if (pageIndicator) {
        pageIndicator.textContent = Page ${currentIndex + 1} of ${total};
      }
    }

    function renderFlipbook(pages) {
      if (pageFlip) {
        pageFlip.destroy();
      }

      bookEl.innerHTML = '';
      pages.forEach((p, index) => {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        if (index === 0 || index === pages.length - 1) {
          pageDiv.setAttribute('data-density', 'hard');
        }
        const img = document.createElement('img');
        img.src = p.src;
        img.alt = Book Page ${index + 1};
        pageDiv.appendChild(img);
        bookEl.appendChild(pageDiv);
      });

      const isMobile = window.innerWidth < 768;
      const pageWidth = isMobile ? Math.min(window.innerWidth - 40, 350) : 450;
      const pageHeight = pageWidth * 1.33;

      pageFlip = new St.PageFlip(bookEl, {
        width: pageWidth,
        height: pageHeight,
        size: isMobile ? "fixed" : "stretch",
        minWidth: 300,
        maxWidth: 600,
        minHeight: 400,
        maxHeight: 800,
        maxShadowOpacity: 0.5,
        showCover: true,
        mobileScrollSupport: true
      });

      pageFlip.loadFromImages(pages.map(p => p.src));

      pageFlip.on('flip', (e) => {
        playFlipSound();
        updateIndicator(e.data, pages.length);
      });

      updateIndicator(0, pages.length);
    }

    // File input handler for images/PDFs
    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      showLoader(Processing ${files.length} file(s)...);
      let pages = [];

      for (const file of files) {
        if (file.type === 'application/pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const viewport = page.getViewport({ scale: 1.5 });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            pages.push({ src: canvas.toDataURL() });
          }
        } else if (file.type.startsWith('image/')) {
          const src = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.readAsDataURL(file);
          });
          pages.push({ src });
        }
      }

      if (pages.length > 0) {
        renderFlipbook(pages);
      }
      hideLoader();
    });

    // Navigation buttons
    prevBtn.addEventListener('click', () => {
      if (pageFlip) pageFlip.flipPrev();
    });

    nextBtn.addEventListener('click', () => {
      if (pageFlip) pageFlip.flipNext();
    });
  </script>
</body>
</html>
