<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Book Creator</title>
    <style>
        body { background: #1e293b; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; color: #38bdf8; }
        .controls { margin-bottom: 15px; display: flex; gap: 10px; }
        button { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
        
        .book { width: 350px; height: 450px; background: #fdfbf7; color: #000; border-radius: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); display: none; flex-direction: column; justify-content: space-between; padding: 25px; position: relative; }
        .book h2 { font-size: 1.2rem; color: #334155; }
        .book p { font-size: 1rem; color: #475569; line-height: 1.4; flex-grow: 1; margin-top: 10px; }
        .page-num { font-size: 0.8rem; color: #94a3b8; text-align: right; }
    </style>
</head>
<body>

    <h1>Simple E-Book Creator</h1>

    <div class="controls">
        <button class="btn-green" onclick="startBook()">Start</button>
        <button id="prevBtn" style="display:none;" onclick="changePage(-1)">Prev</button>
        <button id="nextBtn" style="display:none;" onclick="changePage(1)">Next</button>
        <button id="addBtn" style="display:none;" onclick="addPage()">+ Add Page</button>
    </div>

    <div class="book" id="bookBox">
        <h2 id="pTitle">Cover Page</h2>
        <p id="pText">Welcome! Click '+ Add Page' to write your e-book.</p>
        <div class="page-num" id="pNum">Page 1 of 1</div>
    </div>

    <script>
        let pages = [{ title: "Cover Page", text: "Welcome! Click '+ Add Page' to write your e-book." }];
        let index = 0;

        function startBook() {
            document.getElementById('bookBox').style.display = 'flex';
            document.getElementById('prevBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'inline-block';
            document.getElementById('addBtn').style.display = 'inline-block';
            updatePage();
        }

        function addPage() {
            pages.push({ title: Page ${pages.length + 1}, text: "Yeh naye page ka content hai..." });
            index = pages.length - 1;
            updatePage();
        }

        function changePage(dir) {
            if (index + dir >= 0 && index + dir < pages.length) {
                index += dir;
                updatePage();
            }
        }

        function updatePage() {
            document.getElementById('pTitle').innerText = pages[index].title;
            document.getElementById('pText').innerText = pages[index].text;
            document.getElementById('pNum').innerText = Page ${index + 1} of ${pages.length};
        }
    </script>
</body>
</html>
