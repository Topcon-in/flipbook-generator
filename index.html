<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flipbook Generator - Client Side</title>
  <!-- Tailwind CSS for modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- PageFlip Library -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <!-- PDF.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

  <!-- Header -->
  <header class="w-full max-w-4xl flex flex-col sm:flex-row items-center justify-between py-4 border-b border-slate-800 gap-4">
    <h1 class="text-2xl font-black tracking-wider text-amber-400">FLIPBOOK STUDIO 3D</h1>
    <div class="flex items-center gap-3">
      <button onclick="window.loadSampleBook()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-4 py-2 rounded-lg transition shadow-lg">
        Try Demo Book
      </button>
      <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold px-4 py-2 rounded-lg cursor-pointer transition border border-slate-700">
        Upload PDF / Images
        <input type="file" id="fileInput" accept="image/*,application/pdf" multiple class="hidden">
      </label>
    </div>
  </header>

  <!-- Main Viewer Area -->
  <main class="w-full max-w-5xl flex-1 flex flex-col items-center justify-center relative my-8">
    
    <!-- Loader Overlay -->
    <div id="loader" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
      <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="loaderText" class="text-slate-300 font-medium">Processing book...</p>
    </div>

    <!-- Flipbook Container -->
    <div id="flipbookWrapper" class="w-full flex items-center justify-center overflow-hidden py-6">
      <div id="bookContainer">
        <canvas id="flipbook"></canvas>
      </div>
    </div>

    <!-- Controls / Navigation -->
    <div class="flex items-center gap-6 mt-6 bg-slate-800/60 backdrop-blur px-6 py-3 rounded-full border border-slate-700/50 shadow-xl">
      <button id="prevBtn" class="hover:text-amber-400 font-bold transition disabled:opacity-30">◀️ Prev</button>
      <span id="pageIndicator" class="text-sm font-semibold tracking-wide text-slate-300">Page 0 of 0</span>
      <button id="nextBtn" class="hover:text-amber-400 font-bold transition disabled:opacity-30">Next ▶️</button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-xs text-slate-500 py-2">
    Client-side 3D Flipbook Engine • Zero Server Uploads Required
  </footer>
